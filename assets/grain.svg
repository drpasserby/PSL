<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="presentation">
  <!-- 纸纤维颗粒：fractalNoise 生成，stitchTiles 保证 240px 平铺无缝。
       颜色固定为暖墨灰，靠 alpha 通道出噪点；CSS 侧用 opacity 0.05
       与 multiply / screen 混合，只压纸的质感，不落在正文层上。 -->
  <filter id="psl-grain" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="17" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="
      0 0 0 0 0.44
      0 0 0 0 0.40
      0 0 0 0 0.35
      0.55 0.30 0.15 0 0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.85"/>
    </feComponentTransfer>
  </filter>
  <rect width="240" height="240" filter="url(#psl-grain)"/>
</svg>
